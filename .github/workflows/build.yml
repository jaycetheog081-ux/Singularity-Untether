name: Build Singularity

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out Singularity
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$HOME/theos"

          if [ ! -d "$THEOS/makefiles" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          mkdir -p "$THEOS/sdks"

          if [ -z "$(find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)" ]; then
            git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
            find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -type d -name '*.sdk' \
              -exec mv {} "$THEOS/sdks/" \;
          fi

          if [ -z "$(find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)" ]; then
            echo "ERROR: No iOS SDKs were installed."
            exit 1
          fi

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find packages -name '*.deb' -print -quit)"

          if [ -z "$DEB" ]; then
            echo "ERROR: No .deb package was generated."
            exit 1
          fi

          echo "Package: $DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"

          if dpkg-deb --contents "$DEB" | grep -q '/var/jb/'; then
            echo "ERROR: Rootless paths detected."
            exit 1
          fi

          if ! dpkg-deb --contents "$DEB" | grep -q 'usr/bin/singularity'; then
            echo "ERROR: Expected executable is missing."
            exit 1
          fi

          echo "Package layout checks passed."

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Singularity-deb
          path: packages/*.deb
          if-no-files-found: error
